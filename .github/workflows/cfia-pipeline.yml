name: CFIA Pipeline

on:
  workflow_dispatch:        # Allow manual runs
  schedule:
    - cron: "0 18 * * *"    # Run daily at 18:00 UTC (14:00 ET)

permissions:
  id-token: write            # Required for OIDC login
  contents: write

env:
  AZURE_RG: ${{ secrets.AZURE_RG }}
  AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./CFIA Food Recalls Project"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Azure OIDC login
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 2: Open firewall for this runner
      - name: Open firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          az sql server firewall-rule create \
            --resource-group $AZURE_RG \
            --server $AZURE_SQL_SERVER \
            --name gh-${GITHUB_RUN_ID} \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP
      
      - name: Wait for firewall to propagate
        run: sleep 10

      - name: List firewall rules (debug)
        run: az sql server firewall-rule list --resource-group $AZURE_RG --server $AZURE_SQL_SERVER --output table
        
      # Step 3: Install SQL Server ODBC driver
      - name: Install SQL Server ODBC driver
        run: |
          # Remove any existing Microsoft repo/key to avoid conflicts
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /usr/share/keyrings/microsoft-prod.gpg

          # Download and install the Microsoft repo package
          curl https://packages.microsoft.com/keys/microsoft.asc | \
            gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null

          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/microsoft-prod.list

          # Update apt and install the ODBC driver
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          
      # Step 4: Install Poetry and dependencies
      - name: Install Poetry
        run: pipx install poetry==2.1.3

      # Step 5: Install dependencies
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # Step 6: Run the pipeline
      - name: Run pipeline
        env:
          CFIA_SQL_SERVER:   ${{ secrets.CFIA_SQL_SERVER }}
          CFIA_SQL_DATABASE: ${{ secrets.CFIA_SQL_DATABASE }}
          CFIA_SQL_USER:     ${{ secrets.CFIA_SQL_USER }}
          CFIA_SQL_PASSWORD: ${{ secrets.CFIA_SQL_PASSWORD }}
        run: poetry run python cfia_run_pipeline.py
        continue-on-error: false

      # Step 7: Check if the processed file was updated
      - name: Show first lines of processed file (debug)
        run: |
          echo "Dumping head of processed file:"
          head -n 3 "recalls/processed_cfia_food_recalls.csv"

      # Step 8: Commit the updated CSV back to repo
      - name: Commit updated CSV
        uses: EndBug/add-and-commit@v9
        with:
          add: '["recalls/cfia_recalls_raw.csv", "recalls/cfia_food_recalls.csv", "recalls/processed_cfia_food_recalls.csv"]'
          cwd: "./CFIA Food Recalls Project"
          message: Commit recall files generated from the latest workflow
          default_author: github_actions

      # Step 9: Get Client Credentials
      - name: Get AAD token (client credentials)
        id: token
        run: |
          resp=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.POWERBI_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.POWERBI_CLIENT_SECRET }}" \
            -d "scope=https://analysis.windows.net/powerbi/api/.default" \
            -d "grant_type=client_credentials" \
            "https://login.microsoftonline.com/${{ secrets.POWERBI_TENANT_ID }}/oauth2/v2.0/token")
          echo "token=$(echo "$resp" | jq -r .access_token)" >> $GITHUB_OUTPUT

      # Step 10: Refresh PBI Dashboard
      - name: Trigger dataset refresh
        id: refresh
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            "https://api.powerbi.com/v1.0/myorg/groups/${{ secrets.POWERBI_WORKSPACE_ID }}/datasets/${{ secrets.POWERBI_DATASET_ID }}/refreshes" \
            -d '{"type":"Full"}' > status.txt
          code=$(cat status.txt)
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "Unexpected HTTP $code from refresh trigger"
            exit 1
          fi

      # Step 11: Show dashboard link
      - name: Print dashboard link
        run: echo "Dashboard refreshed! Open it here: https://app.powerbi.com/view?r=eyJrIjoiMzc1MDlhNmEtNzliNi00ZDA4LWI1NWEtZjFlZGFhZTU0ZDMxIiwidCI6ImVmNTJhMmE2LTk1OGUtNDQ2ZC05N2Y1LTc3NmI5NGI4YTBjYyJ9"

      # Step 12: Close firewall rule
      - name: Close firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group $AZURE_RG \
            --server $AZURE_SQL_SERVER \
            --name gh-${GITHUB_RUN_ID} 
